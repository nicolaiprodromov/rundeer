settings:
  Agent:
    Provider: anthropic/claude-opus-5-5/Default
    Max_turns: 4000
    Max_tokens: 99999999
  UI:
    Header:
      title: rundeer
      version: 0.3.5
      menu: compact
      workspace: true
      reverse: false
    Tree:
      Canvas:
        cell_size: 50
        thickness: 1.1
        opacity: 0.4
        selection_color: oklch(96% 0 0)
      Node Menu:
        position: right
      Palette:
        width: 200
        height: 400
        x_pos: 0
        y_pos: 0
        conv_display: false
        fullscreen: false
    Explore:
      ignore_patterns: '*.env,*.env.example,__pycache__/,.git/,.venv/,venv/,node_modules/,src/,web/,.gitignore,.repomixignore,package.json,package-lock.json,repomix.config.json,requirements.txt,rundeer.py,__init__.py,__main__.py,.github/,.repomix/,.crush/,.claude/,.rundeer/data/,.rundeer/outputs/,.rundeer/graphs/,.rundeer/agent/'
  Nodes:
    Categories:
      Primitives: oklch(53.5% 0.3 250)
      Operations: oklch(55% 0.2 140)
      Layout: oklch(50% 0.2 300)
      Prompt: oklch(60% 0.25 60)
      Grok Imagine: oklch(100% 1 7)
      Bundle: oklch(55% 0.2 180)
      Loop: oklch(50% 0.2 330)
      Triggers: oklch(55% 0.25 90)
      Coordinates: oklch(50% 0.2 210)
      Output: oklch(55% 0.25 25)
      Agent Brain: oklch(50% 0.2 350)
      Terminal: oklch(45% 0.12 160)
    Links:
      interpolation: bezier
      thickness: 5
  Shortcuts:
    runGraph: Mod+Enter
    addNodeMenu: Shift+A
    renameNode: F2
    grabNodes: G
    scaleNodes: S
    placeReroute: E
    muteNodes: M
    togglePalette: T
    openRuns: R
    toggleAgentPanel: N
    toggleRunLog: P
    cutSelection: Mod+X
    deleteSelection: Delete
    selectAll: A
    duplicateSelection: Shift+D
    frameAll: Home
    fitView: Shift+C
    autoConnect: F
    hideNodes: H
    previewSelected: Alt+P
    previewPrevious: ArrowLeft
    previewNext: ArrowRight
    previewZoomIn: ArrowUp
    previewZoomOut: ArrowDown
    saveGraph: Mod+S
    loadGraphJson: Mod+O
