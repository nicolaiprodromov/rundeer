text-input:
  label: String
  category: Primitives
  desc: "Multi-line string value (markdown · @mentions)"
  defaultWidth: 280
  defaultHeight: 240
  in: []
  out:
    - id: out
      label: String
      type: text
  props:
    - id: value
      label: Value
      kind: textarea
      default: ""
      placeholder: "Markdown — **bold**, _italic_, `code`, > quote, lists, @reference…"
      mdEditor: true
    - id: highlight_pairs
      category: Settings
      label: "Word Colors"
      kind: textarea
      default: ""
      placeholder: "sun = rgb(255, 210, 80)\nshadow = 120, 170, 255"
  src: web/static/nodes/primitives/text-input.js