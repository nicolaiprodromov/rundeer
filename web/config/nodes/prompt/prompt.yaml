prompt:
  label: Prompt
  category: Prompt
  desc: "Prompt a model with optional image context"
  in:
    - id: prompt
      label: Prompt In
      type: text
    - id: input
      label: Context Images
      type: image
      multi: true
  out:
    - id: out
      label: Response
      type: text
  props:
    - id: model
      category: Model
      label: Model override
      kind: text
      default: ""
      placeholder: "uses env RUNDEER_LLM_MODEL"
    - id: reasoning_effort
      category: Model
      label: Reasoning Effort
      kind: select
      options: [default, none, low, medium, high]
      default: default
    - id: temperature
      category: Sampling
      label: Temperature
      kind: number
      default: 0.7
      placeholder: "0.0 - 2.0"
    - id: top_p
      category: Sampling
      label: Top P
      kind: number
      default: ""
      placeholder: "0.0 - 1.0 (unset)"
    - id: max_tokens
      category: Sampling
      label: Max Tokens
      kind: number
      default: 1024
    - id: seed
      category: Sampling
      label: Seed
      kind: number
      default: ""
      placeholder: "optional"
    - id: frequency_penalty
      category: Sampling
      label: Frequency Penalty
      kind: number
      default: ""
      placeholder: "-2.0 - 2.0 (non-reasoning only)"
    - id: presence_penalty
      category: Sampling
      label: Presence Penalty
      kind: number
      default: ""
      placeholder: "-2.0 - 2.0 (non-reasoning only)"
    - id: stop
      category: Sampling
      label: Stop
      kind: text
      default: ""
      placeholder: "comma-separated (non-reasoning only)"
  traits: [heavy]
  src: web/static/nodes/prompt/prompt.js
  api: /api/filter-prompt