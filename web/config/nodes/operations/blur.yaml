blur-image:
  label: Blur
  category: Operations
  desc: "Gaussian blur an image or video (or bundle)"
  in:
    - id: in
      label: Media
      type: any
  out:
    - id: out
      label: Media
      type: any
  props:
    - id: radius
      label: "Radius"
      kind: range
      min: 0
      max: 400
      step: 0.1
      default: 0
  src: web/static/nodes/operations/blur.js
  api: /api/blur-image