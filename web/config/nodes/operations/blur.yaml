blur-image:
  label: Blur
  category: Operations
  desc: "Gaussian blur an image (or bundle of images)"
  in:
    - id: in
      label: Image
      type: image
  out:
    - id: out
      label: Image
      type: image
  props:
    - id: radius
      label: "Radius"
      kind: range
      min: 0
      max: 400
      step: 0.1
      default: 0
  src: web/static/nodes/operations/blur.js
  api: /api/blur-image