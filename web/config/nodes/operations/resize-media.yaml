resize-media:
  label: Resize
  category: Operations
  desc: "Resize an image or video to a target size with aspect handling."
  in:
    - id: in
      label: Media
      type: any
  out:
    - id: out
      label: Resized
      type: any
  props:
    - id: size
      label: Size
      kind: text
      default: "1024,1024"
      placeholder: "width,height"
      socketType: vector
      passthroughWired: true
    - id: mode
      label: Integration
      kind: select
      options: [none, fill, stretch, contain]
      default: contain
      socketType: text
  src: web/static/nodes/operations/resize-media.js
  api: /api/media/resize