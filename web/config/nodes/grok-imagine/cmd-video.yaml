cmd-video:
  label: Video
  category: Grok Imagine
  desc: "Generate video clips"
  in:
    - id: trigger
      label: Run
      type: run
    - id: subject
      label: Subject
      type: text
    - id: motion
      label: Motion
      type: text
    - id: start_frame
      label: Start Frame
      type: image
    - id: input
      label: Reference Images
      type: image
      multi: true
  out:
    - id: out
      label: "Run →"
      type: video
  props:
    - id: style
      category: Run
      label: Style
      kind: text
      default: "Moebius"
      placeholder: "Moebius"
    - id: iterations
      category: Run
      label: Iterations
      kind: number
      default: 1
    - id: concurrency
      category: Run
      label: Concurrency
      kind: number
      default: null
      placeholder: "auto"
    - id: output_dir
      category: Run
      label: Output Dir
      kind: text
      default: ".rundeer/data/outputs"
    - id: output_name
      category: Run
      label: Output Name
      kind: text
      default: "output"
    - id: model
      category: Run
      label: Video Model
      kind: text
      default: "grok-imagine-video"
    - id: aspect_ratio
      category: Media
      label: Aspect Ratio
      kind: text
      default: "16:9"
    - id: duration
      category: Media
      label: "Duration (s)"
      kind: number
      default: 6
    - id: resolution
      category: Media
      label: Resolution
      kind: text
      default: "720p"
      placeholder: "480p, 720p, 1080p"
    - id: reference_ids
      category: References
      label: Style Reference IDs
      kind: text
      default: ""
      placeholder: "e.g. 0,1,2"
    - id: pad_reference
      category: References
      label: Pad References
      kind: checkbox
      default: true
    - id: ref_quality
      category: References
      label: JPEG Quality
      kind: number
      default: 85
  src: web/static/nodes/grok-imagine/cmd-video.js