canvas:
  label: Canvas
  category: Output
  desc: "Composite multiple images on a sized canvas. Each image can be paired with a bottom-left position vector."
  defaultWidth: 360
  defaultHeight: 300
  resizable: true
  in:
    - id: images
      label: Image
      type: image
      multi: true
    - id: positions
      label: Position
      type: vector
      multi: true
  out:
    - id: out
      label: Image
      type: image
  props:
    - id: size
      label: Size
      kind: text
      default: "1024,1024"
      placeholder: "width,height"
      socketType: vector
      passthroughWired: true
  traits: [preview]
  aliases:
    inputs:
      image: images
    outputs:
      image: out
      result: out
  src: web/static/nodes/output/canvas.js
  api: /api/media/canvas