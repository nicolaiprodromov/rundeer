folder-bundle:
  label: Bundle
  category: Bundle
  desc: Emit a bundle from a folder, or extract frames from a video / animated image
  defaultWidth: 280
  in:
  - id: path
    label: Path
    kind: text
    default: ''
    placeholder: folder/ or clip.mp4 / .mov / .webm / .gif / .webp
  - id: kind
    label: Folder Filter
    kind: select
    options: [all, image, video, media]
    default: all
    group: settings
  - id: recursive
    label: Recursive (folder)
    kind: checkbox
    default: false
    group: settings
  - id: fps
    label: Frames / sec (0 = native)
    kind: float
    default: 0
    group: media
  - id: modulo
    label: Modulo (every Nth, 1 = all)
    kind: int
    default: 1
    group: media
  - id: start
    label: 'Start (item/frame #, 0 = first)'
    kind: int
    default: 0
    group: media
  - id: end
    label: 'End (item/frame #, 0 = all)'
    kind: int
    default: 0
    group: media
  - id: format
    label: Frame Format
    kind: select
    options: [png, jpg, webp]
    default: png
    group: media
  out:
  - id: out
    label: Bundle
    type: any
  traits: [producesBundle]
  src: web/nodes/bundle/folder-bundle.js
  api: /api/folder-list
