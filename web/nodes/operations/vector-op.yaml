vector-op:
  label: Vector Op
  category: Operations
  desc: Per-pixel vector op between two fields (image, UV map, vector, or scalar). Mirrors Blender's Vector Math node.
  in:
  - id: a
    label: A
    type: any
  - id: b
    label: B
    type: any
  - id: op
    label: Operation
    kind: select
    options: [add, subtract, multiply, divide, scale, dot, cross, normalize, length, floor, fract, min, max, mix]
    default: add
  out:
  - id: out
    label: Out
    type: any
  src: web/nodes/operations/vector-op.js
  api: /api/uv/vector
