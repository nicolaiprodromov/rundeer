blur-image:
  label: Blur
  category: Operations
  desc: Gaussian blur an image or video (or bundle)
  in:
  - id: in
    label: Media
    type: any
  - id: radius
    label: Radius
    kind: range
    type: float
    min: 0
    max: 400
    step: 0.1
    default: 0
  out:
  - id: out
    label: Media
    type: any
  src: web/nodes/operations/blur.js
  api: /api/blur-image
