resize-media:
  label: Resize
  category: Operations
  desc: Resize an image or video to a target size with aspect handling.
  in:
  - id: in
    label: Media
    type: any
  - id: size
    label: Size
    kind: text
    default: 1024,1024
    placeholder: width,height
    passthroughWired: true
    type: vector
  - id: mode
    label: Integration
    kind: select
    options: [none, fill, stretch, contain]
    default: contain
    type: text
  out:
  - id: out
    label: Resized
    type: any
  src: web/nodes/operations/resize-media.js
  api: /api/media/resize
