math-op:
  label: Math
  category: Operations
  desc: Numeric operation on scalars or per-pixel on images/maps. A/B accept a raw number or a wired image/map.
  in:
  - id: a
    label: A
    kind: float
    default: 0
    passthroughWired: true
    type: any
  - id: b
    label: B
    kind: float
    default: 0
    passthroughWired: true
    type: any
  - id: op
    label: Operation
    kind: select
    options: [add, subtract, multiply, divide, modulo, power, min, max, abs, sqrt, equal, not-equal, greater, greater-equal, less, less-equal]
    default: add
  - id: eps
    label: Epsilon
    kind: float
    default: 0.0001
    type: float
    group: settings
  out:
  - id: out
    label: Result
    type: any
  src: web/nodes/operations/math-op.js
  api: /api/uv/math
