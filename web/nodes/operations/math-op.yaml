math-op:
  label: Math
  category: Operations
  desc: "Numeric operation"
  in:
    - id: a
      label: A
      type: number
    - id: b
      label: B
      type: number
  out:
    - id: out
      label: Result
      type: number
  props:
    - id: op
      label: Operation
      kind: select
      options: [add, subtract, multiply, divide, modulo, power, min, max]
