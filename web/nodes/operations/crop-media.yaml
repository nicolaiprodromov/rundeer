crop-media:
  label: Crop
  category: Operations
  desc: Crop an image or video. Size and position use pixel vectors; position starts at the source bottom-left.
  in:
  - id: in
    label: Media
    type: any
  - id: size
    label: Size
    kind: text
    default: 512,512
    placeholder: width,height
    passthroughWired: true
    type: vector
  - id: position
    label: Position
    kind: text
    default: 0,0
    placeholder: x,y from bottom-left
    passthroughWired: true
    type: vector
  out:
  - id: out
    label: Cropped
    type: any
  src: web/nodes/operations/crop-media.js
  api: /api/media/crop
