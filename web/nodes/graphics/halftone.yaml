halftone:
  label: Halftone
  category: Graphics
  desc: Screen an image into a halftone ink mask (white = ink). Dark areas get bigger dots by default; Gamma > 1 keeps ink to the shadows; Invert screens the light areas. Use as a Mix factor per ink.
  in:
  - id: image
    label: Image
    type: any
  - id: cell
    label: Cell
    kind: float
    default: 12
    passthroughWired: true
    type: float
  - id: angle
    label: Angle
    kind: float
    default: 45
    passthroughWired: true
    type: float
  - id: shape
    label: Shape
    kind: select
    options: [dot, line, square]
    default: dot
    type: text
  - id: gain
    label: Gain
    kind: float
    default: 1
    passthroughWired: true
    type: float
  - id: gamma
    label: Gamma
    kind: float
    default: 1
    passthroughWired: true
    type: float
  - id: soft
    label: Softness
    kind: range
    min: 0
    max: 1
    step: 0.01
    default: 0
    type: float
  - id: invert
    label: Invert
    kind: checkbox
    default: false
    type: boolean
  out:
  - id: out
    label: Mask
    type: image
  traits: [liveUpdate]
  src: web/nodes/graphics/halftone.js
  api: /api/graphics/halftone
