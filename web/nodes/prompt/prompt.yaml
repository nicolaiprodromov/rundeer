prompt:
  label: Prompt
  category: Prompt
  desc: Prompt a model with optional image context
  in:
  - id: trigger
    label: Run
    type: run
  - id: prompt
    label: Prompt In
    type: text
  - id: input
    label: Context Images
    type: image
    multi: true
  - id: model
    label: Model override
    kind: text
    default: ''
    placeholder: uses model from settings
    group: model
  - id: reasoning_effort
    label: Reasoning Effort
    kind: select
    options: [default, none, low, medium, high, xhigh]
    default: default
    group: model
  - id: temperature
    label: Temperature
    kind: float
    default: 0.7
    placeholder: 0.0 - 2.0
    group: sampling
  - id: top_p
    label: Top P
    kind: float
    default: ''
    placeholder: 0.0 - 1.0 (unset)
    group: sampling
  - id: max_tokens
    label: Max Tokens
    kind: int
    default: ''
    placeholder: uses Max_tokens from settings
    group: sampling
  - id: seed
    label: Seed
    kind: int
    default: ''
    placeholder: optional
    group: sampling
  - id: frequency_penalty
    label: Frequency Penalty
    kind: float
    default: ''
    placeholder: -2.0 - 2.0 (non-reasoning only)
    group: sampling
  - id: presence_penalty
    label: Presence Penalty
    kind: float
    default: ''
    placeholder: -2.0 - 2.0 (non-reasoning only)
    group: sampling
  - id: stop
    label: Stop
    kind: text
    default: ''
    placeholder: comma-separated (non-reasoning only)
    group: sampling
  out:
  - id: out
    label: Response
    type: text
  - id: thinking
    label: Thinking
    type: text
  traits: [terminal, heavy]
  src: web/nodes/prompt/prompt.js
  api: /api/filter-prompt
