coordinate:
  label: Coordinate
  category: Coordinates
  desc: Generate a bottom-left UV coordinate map (R=u, G=v in [0,1]). Acts as both a vector field and an image - wire into Mapping, Vector, Render, Preview, or any command's image input.
  defaultWidth: 260
  defaultHeight: 240
  resizable: true
  in:
  - id: width
    label: Width (px)
    kind: int
    default: 1024
  - id: height
    label: Height (px)
    kind: int
    default: 1024
  - id: dpi
    label: DPI
    kind: int
    default: 72
  - id: space
    label: Space
    kind: select
    options: [uv, screen]
    default: uv
  out:
  - id: uv
    label: UV
    type: vector-map
  traits: [preview, terminal, preformatted]
  src: web/nodes/coordinates/coordinate.js
  api: /api/uv/coordinate
