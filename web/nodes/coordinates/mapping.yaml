mapping:
  label: Mapping
  category: Coordinates
  desc: 'Transform a UV map: scale, rotate (deg), then translate, around a configurable pivot.'
  in:
  - id: uv
    label: UV
    type: vector-map
  - id: location_x
    label: X
    kind: float
    default: 0.0
    group: location
  - id: location_y
    label: Y
    kind: float
    default: 0.0
    group: location
  - id: rotation
    label: Rotation (deg)
    kind: float
    default: 0.0
    group: rotation
  - id: scale_x
    label: X
    kind: float
    default: 1.0
    group: scale
  - id: scale_y
    label: Y
    kind: float
    default: 1.0
    group: scale
  - id: pivot_x
    label: X
    kind: float
    default: 0.5
    group: pivot
  - id: pivot_y
    label: Y
    kind: float
    default: 0.5
    group: pivot
  out:
  - id: out
    label: UV
    type: vector-map
  src: web/nodes/coordinates/mapping.js
  api: /api/uv/mapping
