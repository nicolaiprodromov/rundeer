loop-decompose:
  label: Loop · Decompose
  category: Loop
  desc: Iterate a bundle or a fixed number of times, with previous-iteration feedback
  in:
  - id: bundle
    label: Bundle
    type: any
  - id: seed
    label: Seed
    type: any
  - id: times
    label: Times
    type: integer
    kind: int
    default: 1
    min: 0
    step: 1
  - id: loop_id
    label: Loop ID
    kind: text
    default: loop1
    placeholder: unique loop name
  out:
  - id: item
    label: Item
    type: any
  - id: prev
    label: Prev
    type: any
  - id: index
    label: Index
    type: integer
  - id: count
    label: Count
    type: integer
  pairWith: loop-output
  src: web/nodes/loop/loop-decompose.js
