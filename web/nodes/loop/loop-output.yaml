loop-output:
  label: Loop · Output
  category: Loop
  desc: Collect each iteration's value back into a bundle
  in:
  - id: item
    label: Item
    type: any
  - id: loop_id
    label: Loop ID
    kind: text
    default: loop1
    placeholder: matches Decompose
  out:
  - id: out
    label: Bundle
    type: any
  traits: [heavy, producesBundle]
  lazy: [item]
  src: web/nodes/loop/loop-output.js
