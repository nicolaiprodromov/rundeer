canvas:
  label: Canvas
  category: Output
  desc: Composite multiple images on a sized canvas. Each image can be paired with a bottom-left position vector.
  defaultWidth: 360
  defaultHeight: 300
  resizable: true
  in:
  - id: images
    label: Image
    type: image
    multi: true
  - id: positions
    label: Position
    type: vector
    multi: true
  - id: size
    label: Size
    kind: text
    default: 1024,1024
    placeholder: width,height
    passthroughWired: true
    type: vector
  out:
  - id: out
    label: Image
    type: image
  traits: [preview]
  src: web/nodes/output/canvas.js
  api: /api/media/canvas
