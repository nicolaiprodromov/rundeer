cmd-edit:
  label: Edit
  category: Grok Imagine
  desc: "Apply targeted edits"
  in:
    - id: trigger
      label: Run
      type: run
    - id: input
      label: Input Images
      type: image
      multi: true
    - id: subject
      label: Edit Instructions
      type: text
    - id: motion
      label: Motion
      type: text
  out:
    - id: out
      label: "Run →"
      type: any
  props:
    - id: style
      category: Run
      label: Style
      kind: text
      default: "Moebius"
      placeholder: "Moebius"
    - id: iterations
      category: Run
      label: Iterations
      kind: number
      default: 1
    - id: concurrency
      category: Run
      label: Concurrency
      kind: number
      default: null
      placeholder: "auto"
    - id: output_dir
      category: Run
      label: Output Dir
      kind: text
      default: ".rundeer/data/outputs"
    - id: output_name
      category: Run
      label: Output Name
      kind: text
      default: "output"
    - id: model
      category: Run
      label: Model
      kind: text
      default: ""
      placeholder: "auto by type"
    - id: edit_type
      category: Media
      label: Type
      kind: select
      options: [image, video]
      default: image
    - id: aspect_ratio
      category: Media
      label: Aspect Ratio
      kind: text
      default: "1:1"
    - id: resolution
      category: Media
      label: Resolution
      kind: text
      default: ""
      placeholder: "1k/2k or 480p/720p/1080p"
    - id: duration
      category: Media
      label: "Duration (s)"
      kind: number
      default: 6
    - id: reference_ids
      category: References
      label: Style Reference IDs
      kind: text
      default: ""
      placeholder: "e.g. 0,1,2"
    - id: pad_reference
      category: References
      label: Pad References
      kind: checkbox
      default: true
    - id: ref_quality
      category: References
      label: JPEG Quality
      kind: number
      default: 85
    - id: chain
      category: Chain
      label: Chain Edits
      kind: checkbox
      default: false
    - id: chain_compose
      category: Chain
      label: Mask Compose
      kind: checkbox
      default: false
    - id: chain_threshold
      category: Chain
      label: Threshold
      kind: number
      default: 12
    - id: chain_override
      category: Chain
      label: Override
      kind: number
      default: 50
    - id: chain_dilate
      category: Chain
      label: Dilate
      kind: number
      default: 6
    - id: chain_feather
      category: Chain
      label: Feather
      kind: number
      default: 8
    - id: chain_min_region
      category: Chain
      label: Min Region
      kind: number
      default: 64

  traits: [command, heavy]
  aliases:
    inputs:
      run: trigger
      prompt: subject
      reference: input
    outputs:
      result: out
      
  src: web/nodes/grok-imagine/cmd-edit.js