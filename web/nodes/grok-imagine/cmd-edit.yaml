cmd-edit:
  label: Edit
  category: Grok Imagine
  desc: Apply targeted edits
  in:
  - id: trigger
    label: Run
    type: run
  - id: input
    label: Input Images
    type: image
    multi: true
  - id: subject
    label: Edit Instructions
    type: text
  - id: motion
    label: Motion
    type: text
  - id: style
    label: Style
    kind: text
    default: Moebius
    placeholder: Moebius
    group: run
  - id: iterations
    label: Iterations
    kind: int
    default: 1
    group: run
  - id: concurrency
    label: Concurrency
    kind: int
    default: null
    placeholder: auto
    group: run
  - id: output_dir
    label: Output Dir
    kind: text
    default: .rundeer/outputs
    group: run
  - id: output_name
    label: Output Name
    kind: text
    default: output
    group: run
  - id: model
    label: Model
    kind: text
    default: ''
    placeholder: auto by type
    group: run
  - id: edit_type
    label: Type
    kind: select
    options: [image, video]
    default: image
    group: media
  - id: aspect_ratio
    label: Aspect Ratio
    kind: text
    default: '1:1'
    group: media
  - id: resolution
    label: Resolution
    kind: text
    default: ''
    placeholder: 1k/2k or 480p/720p/1080p
    group: media
  - id: quality
    label: Quality
    kind: select
    options: ['', low, medium]
    default: ''
    group: media
  - id: duration
    label: Duration (s)
    kind: int
    default: 6
    group: media
  - id: reference_ids
    label: Style Reference IDs
    kind: text
    default: ''
    placeholder: e.g. 0,1,2
    group: references
  - id: pad_reference
    label: Pad References
    kind: checkbox
    default: true
    group: references
  - id: ref_quality
    label: JPEG Quality
    kind: int
    default: 85
    group: references
  - id: chain
    label: Chain Edits
    kind: checkbox
    default: false
    group: chain
  - id: chain_compose
    label: Mask Compose
    kind: checkbox
    default: false
    group: chain
  - id: chain_threshold
    label: Threshold
    kind: int
    default: 12
    group: chain
  - id: chain_override
    label: Override
    kind: int
    default: 50
    group: chain
  - id: chain_dilate
    label: Dilate
    kind: int
    default: 6
    group: chain
  - id: chain_feather
    label: Feather
    kind: int
    default: 8
    group: chain
  - id: chain_min_region
    label: Min Region
    kind: int
    default: 64
    group: chain
  out:
  - id: out
    label: Run →
    type: any
  traits: [command, heavy]
  src: web/nodes/grok-imagine/cmd-edit.js
