cmd-merge:
  label: Merge
  category: Grok Imagine
  desc: Composite multiple images
  in:
  - id: trigger
    label: Run
    type: run
  - id: input
    label: Input Images
    type: image
    multi: true
  - id: subject
    label: Subject
    type: text
  - id: style
    label: Style
    kind: text
    default: Moebius
    placeholder: Moebius
    group: run
  - id: iterations
    label: Iterations
    kind: int
    default: 1
    group: run
  - id: concurrency
    label: Concurrency
    kind: int
    default: null
    placeholder: auto
    group: run
  - id: output_dir
    label: Output Dir
    kind: text
    default: .rundeer/outputs
    group: run
  - id: output_name
    label: Output Name
    kind: text
    default: output
    group: run
  - id: model
    label: Image Model
    kind: text
    default: grok-imagine-image
    group: run
  - id: aspect_ratio
    label: Aspect Ratio
    kind: text
    default: '1:1'
    group: media
  - id: resolution
    label: Resolution
    kind: text
    default: ''
    placeholder: 1k or 2k
    group: media
  - id: pad_reference
    label: Pad Inputs
    kind: checkbox
    default: true
    group: references
  - id: ref_quality
    label: JPEG Quality
    kind: int
    default: 85
    group: references
  out:
  - id: out
    label: Run →
    type: image
  traits: [command, heavy]
  src: web/nodes/grok-imagine/cmd-merge.js
