cmd-video:
  label: Video
  category: Grok Imagine
  desc: Generate video clips
  in:
  - id: trigger
    label: Run
    type: run
  - id: subject
    label: Subject
    type: text
  - id: motion
    label: Motion
    type: text
  - id: start_frame
    label: Start Frame
    type: image
  - id: input
    label: Reference Images
    type: image
    multi: true
  - id: style
    label: Style
    kind: text
    default: Moebius
    placeholder: Moebius
    group: run
  - id: iterations
    label: Iterations
    kind: int
    default: 1
    group: run
  - id: concurrency
    label: Concurrency
    kind: int
    default: null
    placeholder: auto
    group: run
  - id: output_dir
    label: Output Dir
    kind: text
    default: .rundeer/outputs
    group: run
  - id: output_name
    label: Output Name
    kind: text
    default: output
    group: run
  - id: model
    label: Video Model
    kind: text
    default: grok-imagine-video
    group: run
  - id: aspect_ratio
    label: Aspect Ratio
    kind: text
    default: '16:9'
    group: media
  - id: duration
    label: Duration (s)
    kind: int
    default: 6
    group: media
  - id: resolution
    label: Resolution
    kind: text
    default: 720p
    placeholder: 480p, 720p, 1080p
    group: media
  - id: reference_ids
    label: Style Reference IDs
    kind: text
    default: ''
    placeholder: e.g. 0,1,2
    group: references
  - id: pad_reference
    label: Pad References
    kind: checkbox
    default: true
    group: references
  - id: ref_quality
    label: JPEG Quality
    kind: int
    default: 85
    group: references
  out:
  - id: out
    label: Run →
    type: video
  traits: [command, heavy]
  src: web/nodes/grok-imagine/cmd-video.js
