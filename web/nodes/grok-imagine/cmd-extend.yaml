cmd-extend:
  label: Extend
  category: Grok Imagine
  desc: Extend an existing video clip
  in:
  - id: trigger
    label: Run
    type: run
  - id: source
    label: Source Clip
    type: video
  - id: subject
    label: Subject
    type: text
  - id: motion
    label: Motion
    type: text
  - id: style
    label: Style
    kind: text
    default: Moebius
    placeholder: Moebius
    group: run
  - id: iterations
    label: Iterations
    kind: number
    default: 1
    group: run
  - id: concurrency
    label: Concurrency
    kind: number
    default: null
    placeholder: auto
    group: run
  - id: output_dir
    label: Output Dir
    kind: text
    default: .rundeer/data/outputs
    group: run
  - id: output_name
    label: Output Name
    kind: text
    default: output
    group: run
  - id: model
    label: Video Model
    kind: text
    default: grok-imagine-video
    group: run
  - id: duration
    label: Duration (s)
    kind: number
    default: 6
    group: media
  out:
  - id: out
    label: Run →
    type: video
  traits: [command, heavy]
  src: web/nodes/grok-imagine/cmd-extend.js
